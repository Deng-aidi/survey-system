<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>问卷系统 · 登录/注册</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container auth-page">
    <h1>问卷系统</h1>

    <article class="auth-card">
      <div class="tabs">
        <button id="tab-login" class="active" type="button">登录</button>
        <button id="tab-register" type="button">注册</button>
      </div>

      <form id="form-login">
        <input id="login-username" type="text" placeholder="用户名" required>
        <input id="login-password" type="password" placeholder="密码" required>
        <button type="submit">登录</button>
      </form>

      <form id="form-register" class="hidden">
        <input id="reg-username" type="text" placeholder="用户名" required>
        <input id="reg-password" type="password" placeholder="密码" required>
        <button type="submit">注册</button>
      </form>

      <div id="msg" class="msg"></div>
    </article>
  </main>

  <script src="api.js"></script>
  <script src="index.js"></script>
</body>
</html>
