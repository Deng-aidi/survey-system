<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>填写问卷</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div id="view-loading">加载中…</div>

    <div id="view-error" style="display:none">
      <p id="error-text" class="msg error"></p>
      <p id="error-login" style="display:none"><a href="index.html">去登录</a></p>
    </div>

    <div id="view-survey" style="display:none">
      <h1 id="s-title"></h1>
      <p id="s-desc" class="hint"></p>

      <div id="q-body"></div>

      <div id="q-errors" class="msg error"></div>

      <div class="actions">
        <button id="btn-next" type="button">下一题</button>
        <button id="btn-submit" type="button" style="display:none">提交</button>
      </div>
    </div>

    <!-- 修复白屏：view-success 与 view-survey 平级，showView('view-success') 不再被父节点隐藏 -->
    <div id="view-success" style="display:none">
      <h2>提交成功</h2>
      <p>submission_id：<span id="sub-id"></span></p>
    </div>
  </main>

  <script src="api.js"></script>
  <script src="fill.js"></script>
</body>
</html>
