<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑问卷</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>编辑问卷</h1>
      <a href="surveys.html">返回列表</a>
    </header>

    <div id="msg" class="msg"></div>

    <section id="survey-info" style="display:none">
      <p>
        <strong id="e-title"></strong>
        状态：<span id="e-status"></span>
        <button id="btn-publish" type="button">发布</button>
      </p>
      <p>
        截止时间：<input type="datetime-local" id="e-deadline">
        <button id="btn-save-settings" type="button">保存设置</button>
      </p>
      <p id="readonly-tip" style="display:none">问卷已发布/已锁定，题目与结构不可修改</p>
      <div id="publish-callout" class="callout callout-warning" style="display:none">
        该问卷已发布，题目结构已锁定：不可增删题目、不可修改跳转；截止时间与说明仍可修改。如需改动题目，请新建一份问卷并重新从题库添加。
      </div>
      <ul id="publish-errors" class="errors-list"></ul>
    </section>

    <section id="question-list"></section>

    <h2>添加题目</h2>
    <button id="btn-from-library" type="button" class="secondary outline">从题库添加</button>
    <article class="form-card">
      <form id="form-add">
        <input id="a-title" type="text" placeholder="题目标题（必填）">
        <select id="a-type">
          <option value="single_choice">单选</option>
          <option value="multiple_choice">多选</option>
          <option value="text">文本</option>
          <option value="number">数字</option>
        </select>
        <label><input id="a-required" type="checkbox"> 必答题</label>

        <div id="a-fields-choice">
          <div id="a-options"></div>
          <button type="button" id="a-add-option">+ 添加选项</button>
        </div>
        <div id="a-fields-multiple" style="display:none">
          <input id="a-min-choices" type="number" min="0" placeholder="最少选择数（可选）">
          <input id="a-max-choices" type="number" min="0" placeholder="最多选择数（可选）">
        </div>
        <div id="a-fields-text" style="display:none">
          <input id="a-min-length" type="number" min="0" placeholder="最小长度（可选）">
          <input id="a-max-length" type="number" min="0" placeholder="最大长度（可选）">
        </div>
        <div id="a-fields-number" style="display:none">
          <input id="a-min" type="number" step="any" placeholder="最小值（可选）">
          <input id="a-max" type="number" step="any" placeholder="最大值（可选）">
          <label><input id="a-integer" type="checkbox"> 仅允许整数</label>
        </div>

        <button type="submit">添加题目</button>
      </form>
    </article>

    <dialog id="dlg-library">
      <article>
        <header>
          <button type="button" data-close aria-label="关闭" rel="prev"></button>
          <h2>从题库添加</h2>
        </header>
        <div id="library-msg" class="msg"></div>
        <p class="callout callout-info">同一道题的不同版本会分行显示（题干后标注 vN）。加入哪一行，问卷里就快照哪个版本。</p>
        <table class="striped">
          <thead>
            <tr><th>题干</th><th>题型</th><th>来源</th><th>操作</th></tr>
          </thead>
          <tbody id="library-list"></tbody>
        </table>
      </article>
    </dialog>
  </main>

  <script src="api.js"></script>
  <script src="edit.js"></script>
</body>
</html>
